<script>
document.querySelector('footer .year').textContent = new Date().getFullYear();

document.querySelectorAll('.travel-dot').forEach(function (dot) {
  dot.addEventListener('click', function (e) {
    e.stopPropagation();
    var wasActive = dot.classList.contains('active');
    document.querySelectorAll('.travel-dot.active').forEach(function (d) { d.classList.remove('active'); });
    if (!wasActive) dot.classList.add('active');
  });
});
document.addEventListener('click', function () {
  document.querySelectorAll('.travel-dot.active').forEach(function (d) { d.classList.remove('active'); });
});
</script>
